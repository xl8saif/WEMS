{% extends "base.html" %}
{% block title %}{% if client %}کلائنٹ میں ترمیم{% else %}نیا کلائنٹ{% endif %} — WEMS{% endblock %}
{% block page_title %}{% if client %}کلائنٹ میں ترمیم{% else %}نیا کلائنٹ{% endif %}{% endblock %}
{% block content %}
<div class="card form-card"><form method="post" class="form">
<div class="form-row"><div class="form-group"><label for="name">کلائنٹ کا نام *</label><input type="text" id="name" name="name" value="{{ client.name if client else '' }}" required class="form-input"></div><div class="form-group"><label for="client_type">کلائنٹ کی قسم</label><select id="client_type" name="client_type" class="form-select"><option value="Individual" {% if client and client.client_type == 'Individual' %}selected{% endif %}>فرد</option><option value="Business" {% if client and client.client_type == 'Business' %}selected{% endif %}>کاروباری ادارہ</option><option value="Government" {% if client and client.client_type == 'Government' %}selected{% endif %}>سرکاری ادارہ</option></select></div></div>
<div class="form-row"><div class="form-group"><label for="contact_person">رابطہ فرد</label><input type="text" id="contact_person" name="contact_person" value="{{ client.contact_person if client else '' }}" class="form-input"></div><div class="form-group"><label for="phone">فون نمبر</label><input type="tel" id="phone" name="phone" value="{{ client.phone if client else '' }}" class="form-input" dir="ltr"></div></div>
<div class="form-row"><div class="form-group"><label for="email">ای میل</label><input type="email" id="email" name="email" value="{{ client.email if client else '' }}" class="form-input" dir="ltr"></div><div class="form-group"><label for="cnic">شناختی کارڈ / شناختی نمبر</label><input type="text" id="cnic" name="cnic" value="{{ client.cnic if client else '' }}" class="form-input" dir="ltr"></div></div>
<div class="form-group"><label for="address">پتہ</label><textarea id="address" name="address" rows="3" class="form-input">{{ client.address if client else '' }}</textarea></div>
<div class="form-actions"><button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> {% if client %}اپ ڈیٹ کریں{% else %}محفوظ کریں{% endif %}</button><a href="{{ url_for('clients_list') }}" class="btn btn-outline">منسوخ کریں</a></div>
</form></div>
{% endblock %}
