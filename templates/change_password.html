{% extends "base.html" %}
{% block title %}پاس ورڈ تبدیل کریں — WEMS{% endblock %}
{% block page_title %}پاس ورڈ تبدیل کریں{% endblock %}
{% block content %}
<div class="profile-page">
    <form method="post" class="card form-card pw-form">
        <div class="form-group">
            <label for="old">موجودہ پاس ورڈ</label>
            <input class="form-input" type="password" id="old" name="old" required autocomplete="current-password">
        </div>
        <div class="form-group">
            <label for="new">نیا پاس ورڈ (کم از کم 6 حروف)</label>
            <input class="form-input" type="password" id="new" name="new" required autocomplete="new-password" minlength="6">
        </div>
        <div class="form-group">
            <label for="confirm">نیا پاس ورڈ دوبارہ</label>
            <input class="form-input" type="password" id="confirm" name="confirm" required autocomplete="new-password" minlength="6">
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-key"></i> پاس ورڈ تبدیل کریں</button>
            <a href="{{ url_for('profile_view') }}" class="btn btn-outline">منسوخ کریں</a>
        </div>
    </form>
</div>
{% endblock %}
