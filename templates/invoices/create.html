{% extends "base.html" %}
{% block title %}نئی انوائس — WEMS{% endblock %}
{% block page_title %}نئی انوائس بنائیں{% endblock %}
{% block content %}
<div class="card form-card"><form method="post" class="form" id="invoiceForm">
<div class="form-row"><div class="form-group"><label for="client_id">کلائنٹ *</label><select id="client_id" name="client_id" required class="form-select" onchange="loadClientJobs()"><option value="">-- کلائنٹ منتخب کریں --</option>{% for client in clients %}<option value="{{ client.id }}">{{ client.name }}</option>{% endfor %}</select></div><div class="form-group"><label for="job_id">متعلقہ کام</label><select id="job_id" name="job_id" class="form-select"><option value="">-- کوئی نہیں --</option></select></div></div>
<div class="form-row"><div class="form-group"><label for="issue_date">اجراء کی تاریخ</label><input type="date" id="issue_date" name="issue_date" class="form-input" dir="ltr"></div><div class="form-group"><label for="due_date">ادائیگی کی آخری تاریخ</label><input type="date" id="due_date" name="due_date" class="form-input" dir="ltr"></div></div>
<h3 class="section-title"><i class="fas fa-list"></i> انوائس کی اشیاء</h3><div id="items-container"><div class="invoice-item-row"><input type="text" name="item_description[]" placeholder="تفصیل" class="form-input" required><input type="number" name="item_quantity[]" placeholder="مقدار" value="1" min="0.01" step="0.1" class="form-input qty-input" onchange="calculateTotals()"><input type="number" name="item_unit_price[]" placeholder="فی یونٹ قیمت" min="0" step="0.01" class="form-input price-input" onchange="calculateTotals()"><button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove(); calculateTotals();"><i class="fas fa-trash"></i></button></div></div>
<button type="button" class="btn btn-outline" onclick="addItemRow()"><i class="fas fa-plus"></i> شے شامل کریں</button>
<div class="invoice-summary"><div class="summary-row"><span>ذیلی مجموعہ:</span><span id="subtotal">0.00</span></div><div class="summary-row"><span>ٹیکس (0٪):</span><span id="tax">0.00</span></div><div class="form-row"><div class="form-group"><label>رعایت</label><input type="number" name="discount" id="discount" value="0" min="0" step="0.01" class="form-input" onchange="calculateTotals()"></div></div><div class="summary-row total"><span>کل رقم:</span><span id="total">0.00</span></div></div>
<div class="form-group"><label for="notes">نوٹس</label><textarea id="notes" name="notes" rows="2" class="form-input"></textarea></div>
<div class="form-actions"><button type="submit" class="btn btn-success"><i class="fas fa-save"></i> انوائس بنائیں</button><a href="{{ url_for('invoices_list') }}" class="btn btn-outline">منسوخ کریں</a></div>
</form></div>
<script>
function addItemRow(){const container=document.getElementById('items-container');const row=document.createElement('div');row.className='invoice-item-row';row.innerHTML=`<input type="text" name="item_description[]" placeholder="تفصیل" class="form-input" required><input type="number" name="item_quantity[]" placeholder="مقدار" value="1" min="0.01" step="0.1" class="form-input qty-input" onchange="calculateTotals()"><input type="number" name="item_unit_price[]" placeholder="فی یونٹ قیمت" min="0" step="0.01" class="form-input price-input" onchange="calculateTotals()"><button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove(); calculateTotals();"><i class="fas fa-trash"></i></button>`;container.appendChild(row);}
function calculateTotals(){let subtotal=0;document.querySelectorAll('.invoice-item-row').forEach(row=>{const qty=parseFloat(row.querySelector('.qty-input').value)||0;const price=parseFloat(row.querySelector('.price-input').value)||0;subtotal+=qty*price;});const discount=Math.max(0,parseFloat(document.getElementById('discount').value)||0);document.getElementById('subtotal').textContent=subtotal.toFixed(2);document.getElementById('tax').textContent='0.00';document.getElementById('total').textContent=Math.max(0,subtotal-discount).toFixed(2);}
async function loadClientJobs(){const clientId=document.getElementById('client_id').value;const jobSelect=document.getElementById('job_id');jobSelect.innerHTML='<option value="">-- کوئی نہیں --</option>';if(!clientId)return;try{const res=await fetch(`/api/client/${clientId}/jobs`);if(!res.ok)throw new Error('Request failed');const jobs=await res.json();jobs.forEach(job=>{const opt=document.createElement('option');opt.value=job.id;opt.textContent=`${job.job_title} - ${job.cost}`;jobSelect.appendChild(opt);});}catch(e){console.error(e);}}
document.getElementById('invoiceForm').addEventListener('submit',function(e){const rows=[...document.querySelectorAll('.invoice-item-row')];const validRows=rows.filter(row=>row.querySelector('[name="item_description[]"]').value.trim());if(!validRows.length){e.preventDefault();alert('کم از کم ایک انوائس آئٹم شامل کریں۔');return;}const subtotal=validRows.reduce((sum,row)=>sum+(parseFloat(row.querySelector('.qty-input').value)||0)*(parseFloat(row.querySelector('.price-input').value)||0),0);const discount=parseFloat(document.getElementById('discount').value)||0;if(discount>subtotal){e.preventDefault();alert('رعایت ذیلی مجموعے سے زیادہ نہیں ہو سکتی۔');}});
document.getElementById('issue_date').valueAsDate=new Date();const due=new Date();due.setDate(due.getDate()+30);document.getElementById('due_date').valueAsDate=due;calculateTotals();
</script>
{% endblock %}
