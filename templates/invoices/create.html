{% extends "base.html" %}
{% block title %}Create Invoice - WEMS{% endblock %}
{% block page_title %}Create Invoice{% endblock %}
{% block content %}
<div class="card form-card">
    <form method="post" class="form" id="invoiceForm">
        <div class="form-row">
            <div class="form-group">
                <label for="client_id">Client *</label>
                <select id="client_id" name="client_id" required class="form-select" onchange="loadClientJobs()">
                    <option value="">-- Select Client --</option>
                    {% for client in clients %}
                    <option value="{{ client.id }}">{{ client.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="job_id">Related Job</label>
                <select id="job_id" name="job_id" class="form-select"><option value="">-- None --</option></select>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label for="issue_date">Issue Date</label>
                <input type="date" id="issue_date" name="issue_date" class="form-input">
            </div>
            <div class="form-group">
                <label for="due_date">Due Date</label>
                <input type="date" id="due_date" name="due_date" class="form-input">
            </div>
        </div>
        <h3 class="section-title"><i class="fas fa-list"></i> Invoice Items</h3>
        <div id="items-container">
            <div class="invoice-item-row">
                <input type="text" name="item_description[]" placeholder="Description" class="form-input" required>
                <input type="number" name="item_quantity[]" placeholder="Qty" value="1" step="0.1" class="form-input qty-input" onchange="calculateTotals()">
                <input type="number" name="item_unit_price[]" placeholder="Unit Price" step="0.01" class="form-input price-input" onchange="calculateTotals()">
                <button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove(); calculateTotals();"><i class="fas fa-trash"></i></button>
            </div>
        </div>
        <button type="button" class="btn btn-outline" onclick="addItemRow()"><i class="fas fa-plus"></i> Add Item</button>
        <div class="invoice-summary">
            <div class="summary-row"><span>Subtotal:</span><span id="subtotal">0.00</span></div>
            <div class="summary-row"><span>Tax (0%):</span><span id="tax">0.00</span></div>
            <div class="form-row"><div class="form-group"><label>Discount</label><input type="number" name="discount" id="discount" value="0" step="0.01" class="form-input" onchange="calculateTotals()"></div></div>
            <div class="summary-row total"><span>Total:</span><span id="total">0.00</span></div>
        </div>
        <div class="form-group">
            <label for="notes">Notes</label>
            <textarea id="notes" name="notes" rows="2" class="form-input"></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Create Invoice</button>
            <a href="{{ url_for('invoices_list') }}" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
<script>
function addItemRow() {
    const container = document.getElementById('items-container');
    const row = document.createElement('div');
    row.className = 'invoice-item-row';
    row.innerHTML = `<input type="text" name="item_description[]" placeholder="Description" class="form-input" required><input type="number" name="item_quantity[]" placeholder="Qty" value="1" step="0.1" class="form-input qty-input" onchange="calculateTotals()"><input type="number" name="item_unit_price[]" placeholder="Unit Price" step="0.01" class="form-input price-input" onchange="calculateTotals()"><button type="button" class="btn btn-danger btn-sm" onclick="this.parentElement.remove(); calculateTotals();"><i class="fas fa-trash"></i></button>`;
    container.appendChild(row);
}
function calculateTotals() {
    let subtotal = 0;
    document.querySelectorAll('.invoice-item-row').forEach(row => {
        const qty = parseFloat(row.querySelector('.qty-input').value) || 0;
        const price = parseFloat(row.querySelector('.price-input').value) || 0;
        subtotal += qty * price;
    });
    const discount = parseFloat(document.getElementById('discount').value) || 0;
    document.getElementById('subtotal').textContent = subtotal.toFixed(2);
    document.getElementById('tax').textContent = '0.00';
    document.getElementById('total').textContent = (subtotal - discount).toFixed(2);
}
async function loadClientJobs() {
    const clientId = document.getElementById('client_id').value;
    const jobSelect = document.getElementById('job_id');
    jobSelect.innerHTML = '<option value="">-- None --</option>';
    if (!clientId) return;
    try {
        const res = await fetch(`/api/client/${clientId}/jobs`);
        const jobs = await res.json();
        jobs.forEach(job => { const opt = document.createElement('option'); opt.value = job.id; opt.textContent = `${job.job_title} - ${job.cost}`; jobSelect.appendChild(opt); });
    } catch(e) { console.error(e); }
}
document.getElementById('issue_date').valueAsDate = new Date();
const due = new Date(); due.setDate(due.getDate() + 30);
document.getElementById('due_date').valueAsDate = due;
</script>
{% endblock %}
